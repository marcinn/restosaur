name: Django CI

on:
  push:
    branches: [ master, 0.7 ]
  pull_request:
    branches: [ master, 0.7 ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        include:
          # Django 1.11
          - django-version: "1.11"
            python-version: "2.7"
          - django-version: "1.11"
            python-version: "3.6"
          - django-version: "1.11"
            python-version: "3.7"
          - django-version: "1.11"
            python-version: "3.8"
          - django-version: "1.11"
            python-version: "3.9"
          # Django 2.0
          - django-version: "2.0"
            python-version: "3.6"
          - django-version: "2.0"
            python-version: "3.7"
          - django-version: "2.0"
            python-version: "3.8"
          - django-version: "2.0"
            python-version: "3.9"
          # Django 2.1
          - django-version: "2.1"
            python-version: "3.6"
          - django-version: "2.1"
            python-version: "3.7"
          - django-version: "2.1"
            python-version: "3.8"
          - django-version: "2.1"
            python-version: "3.9"
          # Django 2.2
          - django-version: "2.2"
            python-version: "3.6"
          - django-version: "2.2"
            python-version: "3.7"
          - django-version: "2.2"
            python-version: "3.8"
          - django-version: "2.2"
            python-version: "3.9"
          # Django 3.0
          - django-version: "3.0"
            python-version: "3.6"
          - django-version: "3.0"
            python-version: "3.7"
          - django-version: "3.0"
            python-version: "3.8"
          - django-version: "3.0"
            python-version: "3.9"
          # Django 3.1
          - django-version: "3.1"
            python-version: "3.6"
          - django-version: "3.1"
            python-version: "3.7"
          - django-version: "3.1"
            python-version: "3.8"
          - django-version: "3.1"
            python-version: "3.9"
          # Django 3.2
          - django-version: "3.2"
            python-version: "3.6"
          - django-version: "3.2"
            python-version: "3.7"
          - django-version: "3.2"
            python-version: "3.8"
          - django-version: "3.2"
            python-version: "3.9"
          # Django 4.0
          - django-version: "4.0"
            python-version: "3.8"
          - django-version: "4.0"
            python-version: "3.9"

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    - name: Run Tests
      run: |
        nosetests tests -s
